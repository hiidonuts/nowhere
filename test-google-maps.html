<!DOCTYPE html>
<html>
<head>
    <title>Google Maps Test</title>
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Google Maps API Test</h1>
    <div id="map"></div>
    <div id="status">Loading...</div>

    <script>
        function initMap() {
            console.log('initMap called');
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 2,
                center: { lat: 20, lng: 0 },
            });
            document.getElementById('status').innerHTML = 'Google Maps loaded successfully!';
            console.log('Google Maps created successfully');
        }

        function onError() {
            console.error('Failed to load Google Maps');
            document.getElementById('status').innerHTML = 'Failed to load Google Maps';
        }

        window.initMap = initMap;
    </script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDNvikF7W4_LPbLiNP8iDJnrv75L0Z9sD0&callback=initMap&libraries=geometry,geocoding"
        onerror="onError()">
    </script>
</body>
</html>
